format_version = 1
id = "gwed.localization"
version = "1.0.0"
name = "Gundam Wing Endless Duel Localization"
author = "Aeon Genesis; Max1323; runtime integration by mstan"
description = "Runtime localization by asset interception: guarded in-memory ROM, WRAM, and VRAM patches that the game's own render path draws. Nothing is drawn over the presented frame, and the ROM file on disk is never modified. English and Spanish are reference fan-translation patch data. French and Italian are native throughout — title mode selector, option and key-config labels, opening/fight crawl, intro caption sprites, and all 162 battle/ending dialogue rows, including accented glyph cells added to the dialogue font. Portuguese is native for the crawl, menus, and caption and falls back to English for the dialogue rows it has not yet authored. Korean and Simplified Chinese are native for the title menu, option menu, key config, opening/fight crawl, intro caption, and the victory/defeat battle dialogue, the last delivered as per-quote 16x16 glyph pages injected into free VRAM tiles behind byte-exact tilemap guards; the post-final conversation and the per-pilot endings still show English under those two languages."
license = "Fan translation reference material; runtime integration MIT"
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "gwed-jp"
rom_sha256 = "dd94308d822636c6ddf73c5e2644c84f2eb8fb4d9201150fc5f37d44d6f423f1"

[[feature]]
id = "localization"
name = "Localization"
description = "Select the text language applied at runtime."
group = "Language"
default_enabled = true

[[option]]
feature = "localization"
id = "language"
label = "Language"
description = "Runtime text language."
group = "Language"
type = "choice"
default = "en"

[[option.choice]]
value = "en"
label = "English"

[[option.choice]]
value = "es"
label = "Spanish"

[[option.choice]]
value = "fr"
label = "French"

[[option.choice]]
value = "it"
label = "Italian"

[[option.choice]]
value = "pt"
label = "Portuguese"

[[option.choice]]
value = "zh"
label = "Chinese (Simplified)"

[[option.choice]]
value = "ko"
label = "Korean"

[[option.choice]]
value = "off"
label = "Original Japanese"

[[plugin]]
feature = "localization"
id = "gwed.localization.runtime"
