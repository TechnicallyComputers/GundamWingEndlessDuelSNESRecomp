# ===========================================================================
# battle_dialogue_3 + ending_dialogue: AUTHORED, CAPTURED, NOT YET ENABLED
# ===========================================================================
# The ko/zh text for these two groups is authored below but COMMENTED OUT,
# and neither group is listed in [surface].groups.  They do NOT render in
# ko/zh; they keep their Latin payloads and show English.
#
# WHY: on 2026-08-31 both screens were finally captured live (story mode
# cleared by freezing the PAR HP words from the debug TCP poll loop -- see
# docs/LOCALIZATION_PLAYBOOK.md section 4a).  The captures DISPROVE the
# assumption that these groups share the victory-quote screen.  Enabling them
# on the quote screen's geometry would guarantee garbage, not risk it: the
# guard at 0xc584 can never match, so the glyph page would never land while
# the ROM rows would still be rewritten to reference it.
#
# CAPTURED GEOMETRY (sh1 run, dlg008-dlg023; states banked in
# tools/validation_states/):
#
#   quote screen (the four groups this file DOES cover)
#     BG3SC 0x63 -> map base 0xc000   BG34NBA 0x22 -> char base 0x4000
#     first map row 22, cols 2..29, VRAM word = (rom & 0x3ff) | 0x2000
#     free page: tile ids 0x300-0x3ff (VRAM 0x7000-0x7fff)
#
#   battle_dialogue_3 screen (post-final Treize conversation)
#     BG3SC 0x79 -> map base 0xf000   BG34NBA 0x66 -> char base 0xc000
#     first map row 22 (guard VRAM 0xf584), VRAM word = (rom & 0x3ff) | 0x2000
#     BG1 map 0xd000, BG2 map 0xe000, BG3 map 0xf000 -- so 0xd000-0xffff is
#     all tilemap and the only tile data under this char base is
#     0xc000-0xcfff, i.e. tile ids 0x000-0x0ff.
#
#   ending_dialogue screen (per-pilot epilogue)
#     BG3SC 0x79 -> map base 0xf000   BG34NBA 0x66 -> char base 0xc000
#     first map row 21 (guard VRAM 0xf544), VRAM word = (rom & 0x3ff) | 0x2400
#     (palette 1, not palette 0 -- this differs from every other group)
#
# TO ENABLE: generate_dialogue_cjk_patch.py currently models ONE [surface].
# It needs an array of surfaces, each with its own map_base / map_first_row /
# char_base / page window / word-OR value (vram_word() hardcodes 0x2000), and
# a free-tile survey of 0xc000-0xcfff on those screens to pick the page window
# (0x080-0x0ff is the candidate: the dialogue font itself occupies the low
# tiles).  Guard uniqueness is per-surface because the guard addresses differ.
