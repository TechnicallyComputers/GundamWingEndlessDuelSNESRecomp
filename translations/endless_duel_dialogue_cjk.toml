# Korean and simplified-Chinese dialogue for the Endless Duel
# victory/defeat quote screen (BG3 2bpp box, map row 22).
#
# Regenerate the runtime patches with:
#   py -3 scripts/generate_dialogue_cjk_patch.py --write
#
# GEOMETRY EVIDENCE (live captures; every recorded quote moment agrees, and
# rows from battle_dialogue_0, _1 and _2 have all been observed rendering
# here, so the four covered groups share one draw routine and one geometry.
# battle_dialogue_3 (0x03eb00+) and ending_dialogue (0x05e000+) have NOT been
# captured and are deliberately NOT covered: their rows keep their Latin
# payloads and render in English under ko/zh.):
#   BG3 map base 0xc000, 64x64 words; the quote box draws its frame on map
#   rows 21 and 26 and its text on rows 22..25.  A quote's first ROM row
#   renders top-half on map row 22 and bottom-half on row 23; its optional
#   second ROM row renders on rows 24/25.  Text occupies columns 2..29
#   (column 1 and 30 are the 0x6001/0x2001 box edges), so 28 cells.
#   The draw routine writes VRAM word = (rom_word & 0x03ff) | 0x2000, i.e.
#   the full 10-bit tile id survives; BG3 char base is 0x4000.
#
# FREE TILE REGION: ids 0x300-0x3ff (VRAM 0x7000-0x7fff) are unreferenced by
# every BG/OBJ on this screen and byte-identical across all eight captures
# (md5 33fa23e2e0cf98f6f36dcfa307acbbc1).  page_source_hex below is that
# 4096-byte blob; each generated page patch guards on the map row, not on
# these bytes, and slices its source_hex out of the blob.
#
# BUDGET: 28 cells per line; a CJK character is 2 cells, ASCII is 1.
# Punctuation is written as ASCII so it uses the game's own Latin cells.

schema = 1

[surface]
name = "battle_quote"
groups = ["battle_dialogue_0", "battle_dialogue_1", "battle_dialogue_2", "battle_dialogue_4"]
map_base = 0xc000
map_row_stride = 0x40
map_first_row = 22
text_start_col = 2
text_cells = 28
char_base = 0x4000
page_tile_first = 0x300
page_tile_last = 0x3ff
page_source_hex = ""

[font.ko]
