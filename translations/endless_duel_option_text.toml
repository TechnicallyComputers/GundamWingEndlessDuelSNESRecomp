# Native option / key-config screen text for the Endless Duel display-list.
#
# The option and key-config screens are drawn from a display list in ROM at
# 0x00c000-0x00c800. A print record (opcode 0x0002) emits font codes until a
# 0xff terminator; `address` here is the first string byte of one such record
# and `source` is its exact stock text. `cursor = true` marks records whose
# first byte is the 0x09 selection cursor, which is preserved verbatim.
#
# ko/zh are rendered natively by injecting glyph tiles into the free font
# codes 0x60-0x9f; regenerate the runtime patches with:
#   python scripts\generate_option_cjk_patch.py --write
#
# Leading spaces carry the on-screen alignment, so keep them; the generator
# pads each translation on the right to the exact record span.

schema = 1

