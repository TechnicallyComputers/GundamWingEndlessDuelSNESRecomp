# Intro caption ("After Colony 195") per-language tile art source.
#
# The caption is OBJ sprite text living in the uncompressed OBJ bank the
# English fan translation writes at ROM 0x00e000-0x00ffff (OBJ VRAM
# 0x8000-0x9fff is a byte-exact linear copy; tile n at 0xe000 + n*32, 4bpp).
# OAM is byte-identical across languages, so only the tile art changes.
#
# Consumed by scripts/generate_intro_caption_patch.py, which emits the
# BEGIN/END GENERATED INTRO CAPTION PATCHES section of endless_duel.toml.
#
# To fall a language back to English, replace its content keys with
#     keep = "en"
# The generator then emits no art for it (or, for languages with no
# fallback_* chain to en, re-emits the English baseline verbatim).

schema = 1

[geometry]
tile_bytes = 32

# Line 1 - "After Colony". 12 tiles x 4 tile rows. Screen y79-110.
# Tiles +0..+5 land at screen x64-111, tiles +6..+11 at x128-175: a hard
# 16px gap at x112-127 sits between them, and its cell is the SHARED blank
# tile 236, which is not part of this rectangle and must never be drawn.
# Canvas row 0 (screen y79-86) is blank in every language; the usable text
# band is canvas y8-31 (screen y87-110), 48x24 px per box.
[geometry.line1]
tiles = 12
row_address = [0xf800, 0xfa00, 0xfc00, 0xfe00]
text_y0 = 8
text_y1 = 31
screen_y0 = 79
[[geometry.line1.box]]
id = "left"
x = 0
width = 48
screen_x = 64
[[geometry.line1.box]]
id = "right"
x = 48
width = 48
screen_x = 128

# Line 2 - "195". 7 tiles x 4 tile rows, screen y119-142 / x88-143.
# Tiles 141-143 / 157-159 / 173-175 are the blinking-cursor sprite (JP
# "年") and are deliberately outside this rectangle.
[geometry.line2]
tiles = 7
row_address = [0xf0c0, 0xf2c0, 0xf4c0, 0xf6c0]
text_y0 = 0
text_y1 = 31
screen_y0 = 119
[[geometry.line2.box]]
id = "digits"
x = 0
width = 56
screen_x = 88

# OBJ palette 7 (CGRAM 240-255) indices. Line 1 text uses the green ramp
# 8-12; index 0 is transparent. Body is the light green, shadow the dark.
[palette]
body = 12
shadow = 9

# Type faces. "proportional" auto-fits one shared point size across both
# boxes of a line and lands both strings on a common baseline. "cell" is
# the fixed square-cell path the BG3 crawl CJK glyphs use
# (scripts/generate_cjk_glyph_tiles.ps1), rendered here through Pillow.
[face.latin]
# Tahoma Bold: chosen over Impact / Arial Black after rendering all four
# strings through every candidate face - it is the only bold on the box
# that keeps the counters of "o"/"e"/"a" open once the 7-letter right box
# forces the shared point size down to 12px.
font = "tahomabd.ttf"
mode = "proportional"
max_size = 22
min_size = 8
threshold = 110
shadow_pad = 1
tracking = 0

[face.ko]
font = "malgun.ttf"
mode = "cell"
cell = 16
size = 16
threshold = 110

[face.th]
# Thai needs shaping, and Pillow here has no libraqm, so this face rasterises
# through GDI/Uniscribe (mode = "gdi", scripts/gdi_text.py).  The caption band is
# 24px -- taller than a Thai line needs -- so nothing is band-compressed: the
# renderer takes the largest size in [min, max] that fits both 48px boxes.
font = "LeelawUI.ttf"
mode = "gdi"
max_size = 22
min_size = 10
threshold = 110
shadow_pad = 1

[face.zh]
font = "msyh.ttc"
mode = "cell"
cell = 16
size = 16
threshold = 110

# --- content -------------------------------------------------------------
# line2 = "keep" leaves the English "195" art in place.

[language.es]
face = "latin"
line1_left = "Tras"
line1_right = "Colonia"
line2 = "keep"

[language.fr]
face = "latin"
line1_left = "Après"
line1_right = "Colonie"
line2 = "keep"

[language.it]
face = "latin"
line1_left = "Dopo"
line1_right = "Colonia"
line2 = "keep"

[language.pt]
face = "latin"
line1_left = "Após"
line1_right = "Colônia"
line2 = "keep"

# Tagalog / Indonesian. Free-form sprite art, so there is no glyph budget -
# only the two 48x24px boxes. "Matapos ang Kolonya" and "Setelah Koloni" are
# the natural renderings of "After Colony"; the geometry is two boxes, so the
# Tagalog linker "ang" is dropped (the era name reads as a two-word label in
# every other language too).
[language.tl]
face = "latin"
line1_left = "Matapos"
line1_right = "Kolonya"
line2 = "keep"

[language.id]
face = "latin"
line1_left = "Setelah"
line1_right = "Koloni"
line2 = "keep"

[language.ko]
face = "ko"
line1_left = "애프터"
line1_right = "콜로니"
line2 = "keep"

[language.th]
# "หลัง โคโลนี" -- literally "after the colony", the same after-plus-colony
# reading es/fr/it/pt/tl/id take, rather than a transliteration of the English
# "After Colony".  line2 keeps the English "195" digits like every language.
face = "th"
line1_left = "หลัง"
line1_right = "โคโลนี"
line2 = "keep"

[language.zh]
face = "zh"
line1_left = "後殖民"
line1_right = "紀元"
line2 = "keep"

# --- baseline ------------------------------------------------------------
# Captured from the pre-split table: the English art the 669 IPS fragments
# used to produce inside the caption rectangles, and the sha256 of the full
# 2MB ROM image the pre-split table produced for en and es. The generator
# hard-fails if the current table stops reproducing these digests.
[baseline]
en_line1_hex = [
  "",
  "",
  "",
  "",
]
en_line2_hex = [
  "",
  "",
  "",
  "",
]

[baseline.rom_sha256]
en = "121c97ce7ea47dbc999c4d37f7cef30ad2d4dd76ee9f4bfe5adcd1b0b8c7e3d2"
# 2026-08: the es digest moved once, deliberately. The generated dialogue
# overlays used to carry no es_hex; the table has no fallback_es, so an
# es-less rom_patch restores source_hex - which for those patches IS the
# English row. At three rows (0x03fa00, 0x05e080, 0x05ef00) the Spanish text
# happened to equal one of the fr/it/pt payloads, so the guard matched and
# Spanish rendered English. generate_dialogue_patch.py now emits an explicit
# es_hex; those three rows are the only bytes that changed, and they now
# match the decoded Spanish reference exactly. en is unchanged.
#
# 2026-09: the es digest moved a second time, also deliberately, and again
# nothing else did - en is byte-identical, as are fr/it/pt/tl/id/zh/ko/th and
# off. generate_dialogue_patch.py now repairs ten Spanish reference rows: seven
# the Max1323 patch left in ENGLISH (0x017900, 0x026d00, 0x026d80, 0x027100,
# 0x027180, 0x02c900, 0x02d900) and three whose top and bottom halves encoded
# different text, drawing split glyphs mid-line (0x017e00 "guera"/"guerra",
# 0x027580 "Quieres"/"Quirees", 0x02cf80 "Soy"/"soy"). The generator now owns
# those rows outright - the imported fragments are split around them exactly
# as they are around the caption rectangles here - and 344 bytes changed, all
# of them inside those ten rows. See scripts/generate_dialogue_patch.py
# (split_reference_fragments, verify_replay) for the proof it runs on --check.
es = "00d7c31b555d7d823f1d1463d414e38aa46e7a747e11c83b7825d85aadd03e25"

