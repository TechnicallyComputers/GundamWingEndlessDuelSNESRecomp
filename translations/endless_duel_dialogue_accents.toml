# Per-language accented glyph cells for the 8x16 dialogue font.
#
# The dialogue font is RAW in the cart at 0x006f00: 2bpp, 128 tiles, 16 bytes
# each, tile n at font_address + n*16. A glyph is an 8x16 cell: top tile t plus
# bottom tile t+0x10.
#
# Five cells are unreferenced by every dialogue tilemap in both reference
# languages (verified by scanning every tilemap word in SCRIPT_RANGES):
#
#   0x001  unreferenced border/filler art
#   0x06a  ':'  (English) - never used by dialogue text
#   0x06b  ';'  (English) - never used by dialogue text
#   0x06e  blank in English; the Spanish hack put the inverted question mark here
#   0x06f  blank in English; the Spanish hack put the inverted exclamation here
#
# Each language gets its OWN allocation of those cells: the same tile index
# means a different character per language, exactly as Spanish already
# repurposes 0x069 (the English apostrophe) for 'n' with a tilde. English and
# Spanish art is preserved byte-for-byte by the baseline payloads recorded
# below.
#
# Per-language budgets: fr uses 4 cells, it 5, pt 5. Portuguese wants more
# diacritics than five cells can hold, so the allocation below is the set the
# authored pt corpus actually needs - a-tilde, e-acute, e-circumflex, a-acute
# and c-cedilla - and translations/endless_duel_dialogue_targets.toml is worded
# to avoid every other accent (no i-acute, o-acute, o-circumflex, o-tilde,
# u-acute, a-grave, a-circumflex, and no UPPERCASE accented letter: the mark
# band overlaps the cap height). The generator hard-fails on any unallocated
# accented character; keep it that way.
#
# Glyph art is COMPOSED, never hand-drawn: the base letter's cell is copied out
# of the English font image and the diacritic is stamped into a cleared band.
# Marks above the x-height go in the empty rows at the top of the top tile (the
# Spanish tilde sits on top-tile row 3; these marks use rows 2-3). A mark BELOW
# the baseline (`half = "bottom"`, the cedilla) goes in the empty rows at the
# bottom of the bottom tile - cell rows 14-15, where the font's own p/g/q
# descenders live, so it reads as part of the letter. Regenerate with:
#
#   py -3 scripts/generate_dialogue_accent_patch.py --write
#
# Do not hand-edit baseline_en_hex / baseline_es_hex: they are captured from the
# pre-split runtime table and are what the byte-identity invariant is checked
# against. Refresh them with --capture-baseline only when the reference import
# itself changes.

schema = 1
font_address = 0x006f00
tile_bytes = 16
bottom_tile_offset = 0x10

# Pixel value written for diacritic ink. The font paints letters as colour 3 on
# a colour-1 background; colour 2 is the soft edge the reference font uses.
ink = 3
background = 1

# Rows 0..4 of the top tile are cleared to background before stamping, which
# also removes the tittle of 'i' so that grave/acute sit correctly on it.
clear_top_rows = 4

# Rows 6..7 of the bottom tile (cell rows 14-15) are cleared before stamping so
# a below-baseline mark has a clean band. Every accent base letter used here
# (a e i o u c) is empty there in the reference font, so clearing is a no-op for
# fr/it and their art is unchanged.
clear_bottom_rows = 2

# Diacritic shapes: one entry per row. "row" is the row index inside the half
# named by "half" ("top", the default, or "bottom"), and "cols" the pixel
# columns (0 = leftmost) that receive ink.
[[mark]]
name = "acute"
row = 2
cols = [4, 5]
[[mark]]
name = "acute"
row = 3
cols = [3, 4]

[[mark]]
name = "grave"
row = 2
cols = [2, 3]
[[mark]]
name = "grave"
row = 3
cols = [3, 4]

[[mark]]
name = "circumflex"
row = 2
cols = [3, 4]
[[mark]]
name = "circumflex"
row = 3
cols = [2, 5]

# The tilde reuses the shape the Spanish hack drew for n-tilde at cell 0x069:
# a single flat bar on top-tile row 3, columns 2-5. Proven legible in-game.
[[mark]]
name = "tilde"
row = 3
cols = [2, 3, 4, 5]

# Cedilla: a stub under the bowl, hooking left, in the descender band.
[[mark]]
name = "cedilla"
half = "bottom"
row = 6
cols = [4]
[[mark]]
name = "cedilla"
half = "bottom"
row = 7
cols = [2, 3, 4]

# ---------------------------------------------------------------------------
# Allocations. `base` names the character whose cell art is copied; `mark` names
# the diacritic stamped on it; `tile` is the free top-tile index that the
# language repurposes.
# ---------------------------------------------------------------------------

[[cell]]
lang = "fr"
char = "é"
tile = 0x06e
base = "e"
mark = "acute"

[[cell]]
lang = "fr"
char = "è"
tile = 0x06f
base = "e"
mark = "grave"

[[cell]]
lang = "fr"
char = "à"
tile = 0x06a
base = "a"
mark = "grave"

[[cell]]
lang = "fr"
char = "ê"
tile = 0x06b
base = "e"
mark = "circumflex"

[[cell]]
lang = "it"
char = "è"
tile = 0x06e
base = "e"
mark = "grave"

[[cell]]
lang = "it"
char = "à"
tile = 0x06f
base = "a"
mark = "grave"

[[cell]]
lang = "it"
char = "ù"
tile = 0x06a
base = "u"
mark = "grave"

[[cell]]
lang = "it"
char = "ì"
tile = 0x06b
base = "i"
mark = "grave"

[[cell]]
lang = "it"
char = "ò"
tile = 0x001
base = "o"
mark = "grave"

[[cell]]
lang = "pt"
char = "ã"
tile = 0x06e
base = "a"
mark = "tilde"

[[cell]]
lang = "pt"
char = "é"
tile = 0x06f
base = "e"
mark = "acute"

[[cell]]
lang = "pt"
char = "ê"
tile = 0x06a
base = "e"
mark = "circumflex"

[[cell]]
lang = "pt"
char = "á"
tile = 0x06b
base = "a"
mark = "acute"

[[cell]]
lang = "pt"
char = "ç"
tile = 0x001
base = "c"
mark = "cedilla"

