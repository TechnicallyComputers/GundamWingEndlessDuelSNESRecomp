# Per-language accented glyph cells for the 8x16 dialogue font.
#
# The dialogue font is RAW in the cart at 0x006f00: 2bpp, 128 tiles, 16 bytes
# each, tile n at font_address + n*16. A glyph is an 8x16 cell: top tile t plus
# bottom tile t+0x10.
#
# EXACTLY FOUR cells are allocable. They are the only cells of the 64 that
# (a) the dialogue charmap does not map to a character the encoder can emit and
# (b) no LIVE tilemap of any dialogue-rendering screen references:
#
#   0x06a  ':'  (English) - never used by dialogue text
#   0x06b  ';'  (English) - never used by dialogue text
#   0x06e  blank in English; the Spanish hack put the inverted question mark here
#   0x06f  blank in English; the Spanish hack put the inverted exclamation here
#
# A FIFTH cell, 0x001, was allocated here until 2026-09-01 (it o-grave, pt
# c-cedilla) on the strength of a survey that scanned only the dialogue tilemap
# pages resident in the cart. That survey was wrong by construction: the
# dialogue BOX FRAME is not a cart tilemap page, it is composed into the live
# BG3 map at 0xf000 when the scene draws, and it is built out of cell 0x001 -
# tile 0x001 is the vertical side rail and tile 0x011 is the corner. Allocating
# that cell replaced the rails and corners with half an accented letter on every
# dialogue screen in Italian and Portuguese (beads-8wg.9.11). The honest survey
# is now recorded in [live_reference] below, regenerated by --survey from the
# live BG3 captures, and --check refuses any allocation that lands on a
# referenced tile. Do not re-add a fifth cell without a survey that says it is
# free.
#
# Cells 0x000 and 0x001 are FRAME CELLS (see [[frame_cell]]): the box art the
# reference translation installed. They are pinned to that art for every
# language so no language can ever corrupt the border again.
#
# Each language gets its OWN allocation of the four: the same tile index means a
# different character per language, exactly as Spanish already repurposes 0x069
# (the English apostrophe) for 'n' with a tilde. English and Spanish art is
# preserved byte-for-byte by the baseline payloads recorded below.
#
# Per-language budgets: fr, it and pt each get exactly four. Every language
# wants more diacritics than four cells can hold, so
# translations/endless_duel_dialogue_targets.toml is worded to avoid the rest -
# see its header, which lists every spelling that was rejected and why. The
# generator hard-fails on any unallocated accented character; keep it that way.
#
# The two accents cut when the fifth cell was withdrawn were chosen from the
# corpus, not from taste - they are the least frequent accent in each language:
#   it  i-grave, 4 occurrences in 4 of 162 rows (vs e-grave 11, o-grave 9,
#       u-grave 7, a-grave 6)
#   pt  c-cedilla, 10 occurrences in 9 of 162 rows (vs a-tilde 29,
#       e-circumflex 19, a-acute 15, e-acute 12)
#
# Glyph art is COMPOSED, never hand-drawn: the base letter's cell is copied out
# of the English font image and the diacritic is stamped into a cleared band.
# Marks above the x-height go in the empty rows at the top of the top tile (the
# Spanish tilde sits on top-tile row 3; these marks use rows 2-3). A mark BELOW
# the baseline (`half = "bottom"`, the cedilla) goes in the empty rows at the
# bottom of the bottom tile - cell rows 14-15, where the font's own p/g/q
# descenders live, so it reads as part of the letter. Regenerate with:
#
#   py -3 scripts/generate_dialogue_accent_patch.py --write
#
# Do not hand-edit baseline_en_hex / baseline_es_hex: they are captured from the
# pre-split runtime table and are what the byte-identity invariant is checked
# against. Refresh them with --capture-baseline only when the reference import
# itself changes.

schema = 1
font_address = 0x006f00
tile_bytes = 16
bottom_tile_offset = 0x10

# Pixel value written for diacritic ink. The font paints letters as colour 3 on
# a colour-1 background; colour 2 is the soft edge the reference font uses.
ink = 3
background = 1

# Rows 0..4 of the top tile are cleared to background before stamping, which
# also removes the tittle of 'i' so that grave/acute sit correctly on it.
clear_top_rows = 4

# Rows 6..7 of the bottom tile (cell rows 14-15) are cleared before stamping so
# a below-baseline mark has a clean band. Every accent base letter used here
# (a e i o u c) is empty there in the reference font, so clearing is a no-op for
# fr/it and their art is unchanged.
clear_bottom_rows = 2

# Diacritic shapes: one entry per row. "row" is the row index inside the half
# named by "half" ("top", the default, or "bottom"), and "cols" the pixel
# columns (0 = leftmost) that receive ink.
[[mark]]
name = "acute"
row = 2
cols = [4, 5]
[[mark]]
name = "acute"
row = 3
cols = [3, 4]

[[mark]]
name = "grave"
row = 2
cols = [2, 3]
[[mark]]
name = "grave"
row = 3
cols = [3, 4]

[[mark]]
name = "circumflex"
row = 2
cols = [3, 4]
[[mark]]
name = "circumflex"
row = 3
cols = [2, 5]

# The tilde reuses the shape the Spanish hack drew for n-tilde at cell 0x069:
# a single flat bar on top-tile row 3, columns 2-5. Proven legible in-game.
[[mark]]
name = "tilde"
row = 3
cols = [2, 3, 4, 5]

# Cedilla: a stub under the bowl, hooking left, in the descender band.
[[mark]]
name = "cedilla"
half = "bottom"
row = 6
cols = [4]
[[mark]]
name = "cedilla"
half = "bottom"
row = 7
cols = [2, 3, 4]

# ---------------------------------------------------------------------------
# Allocations. `base` names the character whose cell art is copied; `mark` names
# the diacritic stamped on it; `tile` is the free top-tile index that the
# language repurposes.
# ---------------------------------------------------------------------------

[[cell]]
lang = "fr"
char = "é"
tile = 0x06e
base = "e"
mark = "acute"

[[cell]]
lang = "fr"
char = "è"
tile = 0x06f
base = "e"
mark = "grave"

[[cell]]
lang = "fr"
char = "à"
tile = 0x06a
base = "a"
mark = "grave"

[[cell]]
lang = "fr"
char = "ê"
tile = 0x06b
base = "e"
mark = "circumflex"

[[cell]]
lang = "it"
char = "è"
tile = 0x06e
base = "e"
mark = "grave"

[[cell]]
lang = "it"
char = "à"
tile = 0x06f
base = "a"
mark = "grave"

[[cell]]
lang = "it"
char = "ù"
tile = 0x06a
base = "u"
mark = "grave"

[[cell]]
lang = "it"
char = "ò"
tile = 0x06b
base = "o"
mark = "grave"

[[cell]]
lang = "pt"
char = "ã"
tile = 0x06e
base = "a"
mark = "tilde"

[[cell]]
lang = "pt"
char = "é"
tile = 0x06f
base = "e"
mark = "acute"

[[cell]]
lang = "pt"
char = "ê"
tile = 0x06a
base = "e"
mark = "circumflex"

[[cell]]
lang = "pt"
char = "á"
tile = 0x06b
base = "a"
mark = "acute"

# ---------------------------------------------------------------------------
# Frame cells. Not allocable: the live BG3 map of every dialogue screen draws
# the text box out of these two cells (0x001 = side rail, 0x011 = corner,
# 0x010 = horizontal rail, 0x000 = the blank the box is filled with). The
# reference translation installed that art over the Japanese font, so the cells
# still need a rom_patch - one that writes the SAME reference art for every
# language. This is what makes "the border is pixel-identical to English in
# every language" an enforced invariant rather than a hope.
# ---------------------------------------------------------------------------

[[frame_cell]]
tile = 0x000
note = "blank fill (top) + horizontal rail (bottom, 0x010)"

[[frame_cell]]
tile = 0x001
note = "vertical side rail (top) + box corner (bottom, 0x011)"

# Live-tilemap survey. Regenerate with:
#   py -3 scripts/generate_dialogue_accent_patch.py --survey
# `tiles` is every dialogue-font tile index referenced by the BG3 map
# of a DRAWN dialogue screen, unioned over `captures`. A cell may only
# be allocated when neither of its two tiles appears here. Captures
# come from analysis/state_validation/<state>_<lang>/, written by
# scripts/validate_from_state.ps1 -DumpVram. Two exclusions, both
# load bearing, both listed in `excluded` so they are auditable
# rather than invisible: captures in a language that ALLOCATES cells
# (the survey would be reading its own accented glyphs back and
# would report every allocated cell occupied), and captures whose
# BG3 character base does not hold the dialogue font at all (the
# title screen reuses that base for different art).

[live_reference]
captures = [
  "pre_ending_en_v2",
  "pre_final_convo_en_v2",
  "pre_quote_en_v2",
  "pre_quote_es_v2",
  "pre_stage_battle_dialogue_3_en_v2",
  "pre_stage_battle_dialogue_3_es_v2",
  "pre_stage_ending_dialogue_en_v2",
  "pre_stage_ending_dialogue_es_v2",
]
tiles = [
  0x000, 0x001, 0x002, 0x004, 0x006, 0x00a, 0x00d, 0x010,
  0x011, 0x012, 0x014, 0x016, 0x01a, 0x01d, 0x024, 0x025,
