# Authored target-language text for decoded dialogue tilemaps.
# Regenerate runtime overlays with:
#   python scripts/generate_dialogue_patch.py --write
#
# The dialogue font supports A-Z, a-z, space, . , ' ? ! plus, per language, the
# accented cells allocated in translations/endless_duel_dialogue_accents.toml
# (fr: e-acute e-grave a-grave e-circumflex; it: e-grave a-grave u-grave
# i-grave o-grave; pt: a-tilde e-acute e-circumflex a-acute c-cedilla). Any
# other accented character is a hard error: rewrite the line rather than
# dropping the accent.
#
# Portuguese consequences of that five-cell budget, so the wording is not
# "re-fixed" later by someone who assumes the accent was forgotten:
#   * no i-acute -> "devemos" not "deveríamos", "grandes tolos" not
#     "tolos incríveis", "bem claro" not "bem visível", "grave" not "terrível",
#     "duro" not "difícil", "Perdeu a fala?" not "Comeu sua língua?"
#   * no o-acute  -> "um contra o outro" not "entre nós"
#   * no o-circumflex -> "nosso lar" not "a colônia" / "as colônias",
#     "Que ironia" not "Que irônico"
#   * no UPPERCASE accented letter (the mark band overlaps the cap height) ->
#     "  Um duelo sem fim..." not "  É um duelo sem fim..."
# The accented intro caption ("Após Colônia") is free-form sprite art and has
# no cell budget, so it keeps its real spelling.
#
# Tagalog (tl) and Bahasa Indonesia (id) allocate ZERO accent cells: both are
# written here in plain ASCII, which is their standard orthography for this
# vocabulary. Two consequences of the base charmap, which has no HYPHEN:
#   * tl  -> "kahit ako lang!" not "kahit mag-isa ako!", "Iba iba" not
#            "Iba-iba", "patay patay" not "patay-patay"; "isa't isa" is fine
#            because the apostrophe IS in the charmap.
#   * id  -> "Jangan buang waktumu." not "Jangan coba-coba.", "Yang ragu pasti
#            kalah!" not "Yang ragu-ragu akan kalah!", "itu sungguh buruk" not
#            "benar-benar buruk", "bunuh bunuh" not "bunuh-bunuh".
# Do not "fix" a missing hyphen by allocating a cell for it: the reduplication
# reads acceptably with a space, and the free cells are spent on fr/it/pt
# diacritics.

