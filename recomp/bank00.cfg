# ── Static function boundaries, 2026-09-09 ───────────────────────────────
# These are HARDWARE CALL LANDINGS: each address below was entered by a real
# JSR/JSL whose target the static analyzer could not reach on its own, because
# reaching it means walking through an indirect dispatch. Declaring them here
# makes them reachability roots for `tools/regen.sh --cfg-roots`, so the
# coverage is a property of the CHECKED-IN CONFIG and reproduces from a clean
# checkout with no run and no profile manifest.
#
# Only call_gap landings are declared. A goto_gap landing can be a mid-function
# label rather than a subroutine entry, and declaring one as a `func` would
# give it a false stack/return ABI — those stay interpreted.
#
# entry_mx is REQUIRED: the `func` directive defaults to entry_mx:1,1, and
# every observation here is M0X0. Omitting it seeds the wrong variant.
#
# Provenance per line: the call site(s) that reached it, observed clean-entry
# count, and the first frame it was seen.

