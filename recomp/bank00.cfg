# Gundam Wing Endless Duel (JPN) — LLE-first seed
# Regenerate with tools/regen.sh. Promote functions by editing recomp/symbols.toml
# and re-running the regen script, which rewrites the block below.
bank = 0
auto_vectors
tier_down_stubs

# Reset vector $8000, native NMI $838c (from the cartridge header).

# $00:8F2F returns through `JML [$00E0]` after rewriting its own stacked return
# address to skip 7 bytes of inline arguments. The analyzer now reads the call
# sites correctly (detect_inline_arg_bytes returns 7, and the routine is no
# longer misread as a jump-table dispatch helper), but the native callable ABI
# still cannot express that terminator: emitted AOT, the JML becomes an
# unresolved dispatch at $00:8F77. Return-stack rewriting is the documented
# force_lle case — the interpreter executes it exactly.
force_lle 008f2f

