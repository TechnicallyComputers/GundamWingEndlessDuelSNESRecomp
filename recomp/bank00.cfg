# Gundam Wing Endless Duel (JPN) — LLE-first seed
# Regenerate with tools/regen.sh. Promote functions by editing recomp/symbols.toml
# and re-running the regen script, which rewrites the block below.
bank = 0
auto_vectors
tier_down_stubs

# Reset vector $8000, native NMI $838c (from the cartridge header).

# $00:8F2F pops its own JSL return frame into $E0/$E1/$E2, adds 7 to it, and
# tail-transfers through `JML [$00E0]` at $00:8F77. Hand-decoded from the ROM
# 2026-09-09, so the shape is no longer inferred:
#   85 E4        STA $E4
#   E2 20        SEP #$20
#   68 85 E0     PLA / STA $E0      pops the 3-byte JSL return frame
#   68 85 E1     PLA / STA $E1
#   68 85 E2     PLA / STA $E2
#   C2 20        REP #$20
#   A5 E4 3A 0A  LDA $E4 / DEC / ASL      selector -> X, indexes the $8F7A table
#   48 AA        PHA / TAX
#   BF 7A 8F ..  LDA long $8F7A,X
#   ...
#   A5 E0        LDA $E0            ($8F70)
#   69 07 00     ADC #$0007         the 7 inline-argument bytes
#   85 E0        STA $E0
#   DC E0 00     JML [$00E0]        ($8F77)
#
# It is a TAIL TRANSFER, not a return: the routine consumes its own frame.
# A JSL pushes return-1, so every landing is exactly call_site + 10; the
# tier-2 capture confirms that for all 14 observed sites with zero bails.
#
# REFUTED 2026-09-09 -- `indirect_dispatch 8f77 14 rtsstack targets:...` with
# those 14 measured landings. It builds and raises AOT share to 66%, but wipes
# the screen at f3127 behind a runaway stack leak (S falls ~0x14E1 per frame
# from f3118, WILD STACK, 8436 RomPtr-invalid off-rails hits). Cause, read off
# the emitted C: the pointer forms select a target by INDEX --
#     uint16 _idx = (uint16)((cpu->X & 0xFFFF) / 3);
# -- and here X is the inline-argument selector for the $8F7A table, which has
# nothing to do with which call site is returning. Case 0 therefore fires for
# almost every call, control lands at $01:9B5C whoever called, and the JSL
# re-executes. The ordering of a `targets:` list is meaningless for this
# construct: the target is a function of the CALLER, not of any index the
# callee holds, so no indexed target list at the callee can express it.
#
# Expressing this needs a return-address-derived tail transfer resolved
# PER CALL SITE (the caller knows its own continuation: site + 10), which the
# current directive vocabulary has no form for. Until then the force_lle
# stands -- return-stack rewriting is the documented force_lle case and the
# interpreter executes it exactly.
#
# COST, measured: this single directive holds 222 nodes at lle_only through
# `unproven_callee_exit` (LLE variants 152 -> 374, exact AOT 2148 -> 1911).
# It is the largest single remaining blocker in this port's burn-down.
force_lle 008f2f

