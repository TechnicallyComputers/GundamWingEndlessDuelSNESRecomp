# Gundam Wing Endless Duel (JPN) — bank $07 analysis input.
bank = 7

# $07:8004 is the SPC700 upload routine. It is entered with PHP, spins on
# unbounded MMIO waits ($07:800D `CMP $2140 / BNE`, and again at $8025/$8035),
# pushes A at $803E, and only unwinds at $805A/$806A/$806B (PLA / PLP / RTS).
#
# KEEP THIS DIRECTIVE. The failure below is real and reproduces. But the
# stack-accounting DIAGNOSIS this comment used to carry was wrong, and the
# measurement it rested on was an instrument bug — retracted 2026-09-09.
#
# What was claimed: "emitted AOT, every one of those spins carries a
# master-deadline yield that returns through interp_bridge_lle_yield_unwind()
# with pushed state live, and the entry/exit stack accounting does not survive
# the round trip", evidenced by the always-on stack-balance auditor:
#
#   bank_07_8004_M0X0  total_delta +7866  calls 23  nonzero 23  last_delta +35
#
# That figure was manufactured by the auditor, two ways:
#
#   1. RecompStackPush() never seeded g_cpu_entry_s[slot] — only the generated
#      prologue did, AFTER the two early-exit yield checks that already call
#      RecompStackPop(). Those pops differenced live S against whatever an
#      unrelated earlier call at the same depth had left in the slot.
#   2. A yield unwind is not a return. The bounce site resumes the INTERPRETER
#      mid-routine with pushed guest state live and the interpreter runs the
#      matching pops, so (S - entry_s) at a yield is mid-flight by
#      construction. $07:8004 is a PHP entry wrapped around unbounded
#      `CMP $2140 / BNE` spins, so it yields on nearly every call — which is
#      exactly why it topped the table and why "calls 23, nonzero 23" looked
#      damning. Every call yielded; none was measurable.
#
# Both are fixed in snesrecomp (RecompStackPush seeds the slot;
# RecompStackPopYield pops without recording a balance figure, counting
# `yields` separately). With the corrected instrument, bank_07_8004_M0X0 does
# not appear in the imbalanced list at all.
#
# What IS still true, measured 2026-09-09 by building the tree with this
# directive removed and running both headless to steady state:
#
#   control (this cfg, frame 584):   inidisp=0x0f bgmode=1 screenEnabled=12/00
#   removed  (frame 4660):           inidisp=0x80 bgmode=0 screenEnabled=00/00
#
# Frames advance in both — it is not a hang. The screen is held in permanent
# forced blank, which is the symptom this comment always described. So the
# directive stays; only its explanation was wrong. The real cause is unfound.
#
# Next lead, from the corrected auditor on the removed-directive build:
#
#   interp@$0080B6   -132282 over 66094 calls, every call nonzero, -2 each
#   interp@$00838C     +5357 over  2681 calls, +2 each   ($838C = native NMI)
#
# A consistent 2-byte leak at one site against a 2-byte gain at the NMI vector
# is a far more specific lead than this routine's ABI ever was. Caveat before
# trusting it: only the AOT yield path was corrected, not interpreter
# tier-downs, so `interp@` entries may still carry the same unfinished-frame
# artifact. Verify that before spending on it.

# ── 2026-09-10: force_lle 078004 RESTORED after a gameplay regression ─────
#
# This directive was removed on 2026-09-09 (commit 9223127) after two real
# interp<->AOT boundary bugs it was masking were found and fixed in the
# framework (snesrecomp c1a17d9 truncated-block bridging, 2d2eeb1 non-local
# return unwind depth). AOT share went 2.95% -> 37% and attract mode was
# verified clean: found0=0, tier2_bail=0, no off-rails, no wild stack,
# screenshots correct through the whole intro and title sequence.
#
# ATTRACT MODE WAS NOT ENOUGH. Real gameplay flickers badly -- sprites and HUD
# elements blinking out and returning. Reported from play and then reproduced
# headless by driving into a match over the debug server (set_controller) and
# counting black frames in screenshots:
#
#   pre-expansion (34 variants)                 1 blank / 16
#   force_lle removed, no funcs (1563 var)      7 blank / 16
#   force_lle removed + 309 funcs (1915 var)    7 blank / 17
#   force_lle RESTORED + 309 funcs (1889 var)   6 blank / 16
#
# The last row is the important one: the regression appears on EITHER route to
# ~1900 variants, so it is the coverage expansion itself and not this
# directive. Restoring force_lle alone does NOT fix it -- the static func
# declarations reach the same code by another path.
#
# LEAD, not a fix. SNESRECOMP_WLOG_ADDR="2100:2100" during a match names the
# INIDISP writers: $00:83E0 and $00:8950 write $80 (forced blank), $00:888E
# writes $00 (on, brightness 0), $00:88E7 writes $0F (the restore). Forcing all
# four to the interpreter at RUNTIME (SNESRECOMP_LLE_INTERP_TARGET_FILE) on the
# 1889-variant tree returns the black-frame rate to 1/16 -- the pre-expansion
# figure -- with the rest of the coverage intact. Individually: $888E alone
# 2/12, $8950 alone 4/12, so no single one accounts for it.
#
# Declaring the same four as cfg `force_lle` did NOT reproduce that (4/16):
# force_lle stops DECODE at the boundary and yields a different tree (1875
# variants), where the runtime deny only redirects entry on an unchanged tree.
# Those two are not interchangeable, which is worth remembering.
#
# So the coverage work is shelved, not abandoned. What is banked and does NOT
# depend on it: both framework boundary fixes, the loud-failure guards, and the
# 309 static func declarations (recoverable from commit 2f4cab3). What is
# needed before re-landing: root-cause which of those four routines is
# miscompiled, by diffing the INIDISP write sequence between a control build
# and an expanded one across the same match frames -- the first divergent
# write names it. Do not re-land on attract-mode evidence alone.
force_lle 078004

# Coverage note: force_lle here stops decode at this boundary, so everything the
# analyzer would otherwise discover THROUGH the boot call chain is pruned with
# it — exact AOT variants drop 1563 -> 34 (measured; identical whether the
# directive sits here or in bank00.cfg). The build still runs a locked 60 fps
# because the interpreter tier is fast enough for this title, so this is a
# deliberate correctness-over-coverage trade. Removing it depends on fixing the
# AOT stack accounting for functions that yield out of an unbounded MMIO spin
# with pushed state live — see the stackbal figures above.
