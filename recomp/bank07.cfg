# Gundam Wing Endless Duel (JPN) — bank $07 analysis input.
bank = 7

# ── force_lle 078004 — REMOVED 2026-09-09, cause found and fixed ──────────
#
# $07:8004 is the SPC700 upload routine: entered with PHP, spins on unbounded
# MMIO waits ($07:800D `CMP $2140 / BNE`, again at $8025/$8035), pushes A at
# $803E, unwinds at $805A/$806A/$806B (PLA / PLP / RTS).
#
# This routine carried a `force_lle` for most of the port's life. It never
# belonged to it. The directive was suppressing a symptom whose cause was two
# interp<->AOT boundary bugs elsewhere; because force_lle stops decode at the
# boundary, it also pruned everything the analyzer would discover THROUGH the
# boot call chain — exact AOT variants 1563 -> 34. The kept directive was
# costing ~97% of the port's static coverage to hide two framework defects.
#
# The record, because two diagnoses were filed here and both were wrong:
#
#   1. RETRACTED. "The AOT stack accounting does not survive the yield round
#      trip", evidenced by the stack-balance auditor reporting
#      bank_07_8004_M0X0 total_delta +7866 over 23 calls, 23 nonzero. That
#      figure was manufactured by the instrument: RecompStackPush() never
#      seeded g_cpu_entry_s[slot], so the early-exit yield pops differenced
#      live S against an unrelated earlier call's leftover; and a yield unwind
#      is not a return — it resumes the interpreter mid-routine with pushed
#      state live, so (S - entry_s) at a yield is mid-flight by construction.
#      This routine yields on nearly every call, which is exactly why it topped
#      the table. Fixed in snesrecomp (c1a17d9): the slot is seeded at push,
#      and RecompStackPopYield pops without recording a balance figure. With
#      the corrected instrument bank_07_8004_M0X0 does not appear at all.
#
#   2. RETRACTED. "bank_00_A6EB's AOT body returns the stack ~6 bytes low."
#      A6EB is where the second failure became visible, not where it was. It
#      is correct as compiled and needs no directive.
#
# The two real causes, both in the framework, both now fixed:
#
#   f3192 — a block that truncated after `JSL $02:80FE` (callee publishes no
#     exit mode, COVERAGE.md §2) emitted a `return RECOMP_RETURN_NORMAL` stub
#     that host-returned without the guest's RTS, leaking 2 bytes per call; the
#     enclosing RTL then popped $D1 as a bank and ran off to $D1:83DA.
#     Fixed by bridging honestly to the interpreter — snesrecomp c1a17d9.
#
#   f3305 — cpu_resolve_ancestor_skip counted HOST frames where the SKIP_N
#     contract decrements per GUEST frame. A guest tail call ($A765 -> $A7F0
#     through the $A76C dispatch) is one guest frame in two host frames, so the
#     unwind went one level too far: A6EB received a SKIP instead of NORMAL,
#     took its propagation exit, and skipped the PLA/PLB restoring its prologue
#     pushes. Fixed by cpu_resolve_unwind_depth() — snesrecomp 2d2eeb1.
#
# Measured with the directive removed and both fixes in, headless to steady
# state: AOT share of guest CPU cycles 2.95% -> 32.73%, found0 = 0,
# tier2_bail = 0, off-rails 0, no wild stack, and PPU state identical to the
# control at the same game state (gs=A4, TM=06, bgmode=1, cgram_nz=156,
# vram_nz=20226). Screenshotted: the attract sequence renders and advances.
#
# Still open, and unrelated to the above — do not let it justify a new
# directive without evidence. On the corrected auditor:
#
#   interp@$0080B6   -132282 over 66094 calls, every call nonzero, -2 each
#   interp@$00838C     +5357 over  2681 calls, +2 each   ($838C = native NMI)
#
# A consistent 2-byte leak at one site against a 2-byte gain at the NMI vector
# is a specific lead, but only the AOT yield path was corrected, not
# interpreter tier-downs, so `interp@` entries may still carry the same
# unfinished-frame artifact. Verify that before spending on it.

# ── Static function boundaries, 2026-09-09 ───────────────────────────────
# These are HARDWARE CALL LANDINGS: each address below was entered by a real
# JSR/JSL whose target the static analyzer could not reach on its own, because
# reaching it means walking through an indirect dispatch. Declaring them here
# makes them reachability roots for `tools/regen.sh --cfg-roots`, so the
# coverage is a property of the CHECKED-IN CONFIG and reproduces from a clean
# checkout with no run and no profile manifest.
#
# Only call_gap landings are declared. A goto_gap landing can be a mid-function
# label rather than a subroutine entry, and declaring one as a `func` would
# give it a false stack/return ABI — those stay interpreted.
#
# entry_mx is REQUIRED: the `func` directive defaults to entry_mx:1,1, and
# every observation here is M0X0. Omitting it seeds the wrong variant.
#
# Provenance per line: the call site(s) that reached it, observed clean-entry
# count, and the first frame it was seen.

func bank_07_80AC 80ac entry_mx:0,0    # from 0x0080C1, 20510 clean entries, first frame 45
