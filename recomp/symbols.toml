# ── Bug #2 investigation — the f3305 blocker (2026-09-09) ─────────────────
# The second interp↔AOT boundary bug behind force_lle 078004, distinct from
# the $8654 truncation stub (fixed in snesrecomp c1a17d9). All emit=false.

[[func]]
name = "DataBankWrap_A6EB"
addr = "a6eb"
bank = 0
emit = false
note = "CONFIRMED culprit of the f3305 wild-stack/black-screen (bug #2). PHB/PHK/PLB data-bank routine looping JSR $A729, closing PLA/PLB/RTL at $A713. Its AOT body returns the stack ~6 bytes low on a path-specific call at f3305 ([ibr]: JSL bounce sp_pre=0FE0 -> sp_post=0FDD, want 0FE3); the misalignment returns into WRAM $05:0000 which recurses $050002->$050000 until SP wraps wild -> PB=$F6. Forcing this one function to the interpreter (SNESRECOMP_LLE_INTERP_TARGET_FILE) makes the game track the control past f3305. Note: the corrected stack auditor does NOT flag A6EB cumulatively, so the leak is a specific branch / RTL-exit path, not the main path (which balances). Exact leaking branch not yet pinned."

[[func]]
name = "sub_A729"
addr = "a729"
bank = 0
emit = false
note = "Loop callee of DataBankWrap_A6EB (JSR $A729). Balanced on its own (measured +2 host-return at f3191). Kept as a boundary/naming aid for the bug #2 drill."

[[func]]
name = "Dispatch_JmpE0_82BF"
addr = "82bf"
bank = 5
emit = false
note = "JMP ($00E0) table dispatcher (table at $82CE, indexed off $1082,X); $05:82CA is the RTL the bad return unwinds through. Reached via the $05:8021 JML [$00E0] tier-down, which bails once at f3305 — but that bail is a RED HERRING: forcing DataBankWrap_A6EB to interp clears f3305 while this bail remains. Not the bug #2 cause."
