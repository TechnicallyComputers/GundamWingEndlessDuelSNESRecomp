# Automatch rulesets — Gundam Wing Endless Duel (SNES).
#
# Deployment data, not source: the live file is `data/automatch_rulesets.toml`
# and is gitignored. Copy this in, or point AUTOMATCH_RULESETS_PATH at it.
# There is no enable flag — automatch is on when at least one usable ruleset
# loads, and off when none does.
#
# `game_name` must match BYTE FOR BYTE what the client announces. The Gundam
# host builds it from SNES_GAME_TITLE (CMakeLists.txt), and it is visible on
# the wire in its own log line:
#     snes_lobby: hello as "…" for game "Gundam Wing Endless Duel"
# A near-miss here is not an error anywhere — the title simply has no rulesets
# and automatch_available answers no, which looks exactly like automatch off.

[[ruleset]]
id        = "standard"
label     = "Standard"
game_name = "Gundam Wing Endless Duel"
max_slots = 2      # v1 refuses anything else at load, loudly

# `game_version` is deliberately OMITTED. Pinning it would restrict the queue
# to one release; leaving it out still pools only players on the SAME release,
# because the match key is an equality bucket either way (AUTOMATCH.md §3).
# Omitting it means a new tagged release starts pooling without a server edit.

[ruleset.match_caps]
# THE SNES CAPS SHAPE, not the PSX one. These are the keys
# snesrecomp/runner/src/lobby/snes_lobby_client.c parses out of match_caps;
# the example file's bios_hle / fast_boot / turbo_loads / auto_skip_fmv are
# PSX fields and this client ignores them.
#
# Every value is written out even where it equals the client-side default,
# because the server OWNS these caps for an automatch room — a key left out is
# a decision made by whichever default happens to be in the peer's build.
widescreen        = false   # vanilla: the wide view is a Mods package, and v1 is vanilla only
widescreen_hud    = false   # MUST be explicit: this key defaults to TRUE when absent,
                            # which would pair "HUD anchored wide" with a 4:3 frame
ws_extra          = 0       # margin in pixels per side; 0 is the "do not patch" signal
ignore_aspect     = false
rollback          = true    # the SFU path both peers run online
input_delay       = 2       # frames; the client clamps to 2..20
force_turn        = false   # let ICE pick; the relay is already in the path
force_input_relay = false

# No `mods` key and no `mod_plan`: v1 is vanilla only, and a `mods` key is
# refused at load rather than at match time.
